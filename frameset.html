<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>fRAMESET</title>
</head>
<frameset rows="18%,82%">
  <frameset cols="15%,19%,26%,18%,22%">
    <frame name="topLeft" title="Top left frame">
    <frame name="topSecond" title="Top second frame">
    <frame name="topMiddle" title="Top middle frame">
    <frame name="topFourth" title="Top fourth frame">
    <frame name="topRight" title="Top right frame">
  </frameset>

  <frameset cols="15%,19%,26%,18%,22%">
    <frameset rows="55%,23%,22%">
      <frame name="leftTop" title="Left top frame">
      <frame name="leftMiddle" title="Left middle frame">
      <frame name="leftBottom" title="Left bottom frame">
    </frameset>

    <frameset rows="55%,23%,22%">
      <frame name="secondTop" title="Second column top frame">
      <frame name="secondMiddle" title="Second column middle frame">
      <frame name="secondBottom" title="Second column bottom frame">
    </frameset>

    <frameset rows="60%,50%">
      <frame name="middleTop" title="Middle column top frame">
      <frame name="middleColumn" title="Middle column frame">
    </frameset>

    <frameset rows="25%,34.5%,50%">
      <frame name="fourthTop" title="Fourth column top frame">
      <frame name="fourthBottom" title="Fourth column bottom frame">
      <frame name="fourthBottomLarge" title="Fourth column large bottom frame">
    </frameset>

    <frameset rows="55%,45%">
      <frame name="rightTop" title="Right top frame">
      <frame name="rightBottom" title="Right bottom frame">
    </frameset>
  </frameset>
</frameset>
<body style="background: linear-gradient(#0f172a,#4f46e5,#9333ea);">
    c xc 
</body>
</html>
