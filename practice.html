<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            
            background-image: url("imagecopy.png");
            background-position: center;       /* इमेज को हमेशा बीच में रखेगा */
            background-repeat: no-repeat;      /* इमेज को रिपीट होने से रोकेगा */
            background-size: cover;          /* इमेज को बिना फटे पूरे स्क्रीन पर परफेक्ट फिट कर देगा */
            height: 100vh;
        }
        
        #main{
            top: 5%;
            display: flex;
            border: none;
            border-radius: 10px;
            background:linear-gradient(rgb(69, 28, 50),rgb(168, 35, 170),rgb(203, 19, 6));
            max-width: 40%;
            justify-content: center;
            align-items: center;
            position: relative;
            height: 85vh;
            left: 30%;
            box-shadow: 10px 10px 5px rgb(95, 5, 173);
            color: aliceblue;
            
        }
        article{
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: transform 5s ease;
            
        }
        #cake{
            display: flex;
            justify-content: flex-end;
        }
        .doors{
            width: 100%;
            height: 100%;
            display: flex;
            position: absolute;
            top: 0px;
            left: 0px;
           
            border-radius: 10px;
            overflow: hidden;
            
        }
        section > div{
            background-color:red;
            height: 100%;
            flex:1;
            border:2px solid black;
            display: flex;
            border-radius: 10px;
            align-items: center;
            padding: 10px;
            transition: transform 5s ease;
            
        }
        #click{
            height: 10px;
            width: 10px;
            background-color: black;
        }
        #main:target #door1{
            transform: translateX(-100%);
        }
        #main:target #door2{
            transform: translateX(100%);
        }
        #main:target article {
            transform: scale(0.5)
        }
        #cake{
            margin-top: 60%;
            padding: 15px;
            
            text-align: center;
            transition: transform 5s ease;
        }
        
        #main:target #cake{
            transform: scale(2.9);
        }

    </style>
</head>
<body>
    <section id="main">
        <article id="content">
            <h1>Happy Birthday</h1>
            <h2>Wishing you very Happy Birthday with my Dil</h2>
            <div id="cake">
                <img src="cake.png" alt="some error occured" height="150px">
            </div>
        </article>
        <section class="doors">
            <div id="door1"></div>
            <div id="door2">
                <a href="#main" id="click"></a>
            </div>
        </section>
    </section>
</body>
</html>
