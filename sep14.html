<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Grayscale Animation</title>

    <style>
        
        p {
            font-size: 40px;
            margin: 20px;
            position: relative;
            width: 500px;

            animation: grayscale 1s infinite;
        }

        span {
            background-color: azure;
            color: blue;
            visibility: hidden;
            position: absolute;
            bottom: 100;
            right: 0;
            font-size: 30px;
        }

        p:hover span {
            visibility: visible;
        }

        @keyframes grayscale {

            0% {
                color: RED;
            }

            25% {
                color: green;
            }

            50% {
                color: yellow
            }

            75% {
                color: aqua;
            }

            100% {
               color: black;
            }

        }
        
    </style>
</head>

<body>

    <p>
        helloo
        <span>this is a hidden text</span>
    </p>

</body>
</html>
