<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    body {
        background-image: url("porche.jpg");
        background-repeat: no-repeat;
        background-size: cover;
    }

    div {
        display: flex;
        flex-direction: column;
        align-items: center;
        margin-top: 150px;
    }

    h1 {
        font-family: Cambria, Cochin, Georgia, Times, 'Times New Roman', serif;
        font-weight: 800;
        font-size: 3.5rem;
        color: rgba(66, 5, 141, 0.4);
        text-shadow: 2px 0px 5px rgb(88, 78, 78);
    }

    h2 {
        display: flex;
        font-family: Cambria, Cochin, Georgia, Times, 'Times New Roman', serif;
        margin-top: -30px;
        color: rgba(66, 5, 141, 0.4);
        font-weight: 500;
        text-shadow: 2px 0px 5px rgb(88, 78, 78)
    }

    button {
        height: 50px;
        width: 150px;
        border-radius: 50%;
        border-color: bisque;
        background-color: rgb(214, 203, 191);
        color: rgba(66, 5, 141, 0.4);
        font-size: 20px;
        font-weight: bold;
    }

    .glass-text {
        font-family: 'Georgia', serif;
        font-size: 3rem;
        font-weight: bold;
        margin: 0;


        background: linear-gradient(90deg, #f3c653 0%, #76c893 35%, #52b69a 65%, #00b4d8 100%);


        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;

        /* Optional soft glow to enhance the glassy look */
        filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.2));
    }
</style>

<body>
    <div>
        <h1>Welcome To Car Saathi</h1>
        <h2>Press Open Now Button To Open</h2>
        <button>Open Now</button>
    </div>
    <div class="glass-container">
        <h1 class="glass-text">real athletes</h1>
    </div>
</body>

</html>
